# Local Persistent Database (Zero-dependency fallback for offline/firewalled networks)
spring.datasource.url=jdbc:h2:file:./data/tindahanko;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate for H2 in PostgreSQL mode
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Security
jwt.secret=TindahanKoSuperSecretKeyForJwtAuthenticationSecurityWorkFactor2026
jwt.expirationMs=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:5173

# Semaphore SMS API (Feature 5: Automated SMS Notification System)
semaphore.api.key=${SEMAPHORE_API_KEY:}
semaphore.sender.name=${SEMAPHORE_SENDER_NAME:SEMAPHORE}

# Spring Mail (Gmail SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Resend API
resend.api.key=${RESEND_API_KEY:}
