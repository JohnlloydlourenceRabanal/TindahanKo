spring.application.name=tindahanko-backend
server.port=${PORT:8080}

# Database Connection (Supabase PostgreSQL via Session Pooler)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Security
jwt.secret=${JWT_SECRET:TindahanKoSuperSecretKeyForJwtAuthenticationSecurityWorkFactor2026}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Semaphore SMS API (Feature 5: Automated SMS Notification System)
semaphore.api.key=${SEMAPHORE_API_KEY:}
semaphore.sender.name=${SEMAPHORE_SENDER_NAME:SEMAPHORE}

# Spring Mail (Gmail SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Resend API
resend.api.key=${RESEND_API_KEY:}
